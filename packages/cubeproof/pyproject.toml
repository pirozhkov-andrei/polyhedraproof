[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cubeproof"
version = "1.0.0"
description = "Cube-tree refutation campaigns with checked LRAT attestations and independent certification"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrei Pirozhkov" }]
keywords = ["SAT", "LRAT", "cube and conquer", "formal verification"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# Standard library only; the proof tools (CaDiCaL, cake_lpr) are external pinned programs.
dependencies = []

[project.urls]
Homepage = "https://github.com/pirozhkov-andrei/polyhedraproof"
Source = "https://github.com/pirozhkov-andrei/polyhedraproof/tree/main/packages/cubeproof"
Issues = "https://github.com/pirozhkov-andrei/polyhedraproof/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cubeproof = ["py.typed"]
