[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "polyhedraproof"
version = "1.0.0rc1"
description = "A reduction of the twelve pairwise-adjacent faces problem to 59 CNF formulas, with a pipeline for checked refutations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrei Pirozhkov" }]
keywords = ["polyhedra", "oriented matroids", "SAT", "LRAT", "formal verification"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# The meta-package of the release (specification §2.2): no code of its own, exactly the three
# distributions of the same release. Their runtime is the standard library; CaDiCaL and
# cake_lpr provide proof search and checking, util-linux prlimit enforces process limits.
dependencies = [
    "cubeproof==1.0.0rc1",
    "neighbourly==1.0.0rc1",
    "faces12-campaign==1.0.0rc1",
]

[project.urls]
Homepage = "https://github.com/pirozhkov-andrei/polyhedraproof"
Issues = "https://github.com/pirozhkov-andrei/polyhedraproof/issues"
Changelog = "https://github.com/pirozhkov-andrei/polyhedraproof/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Development tools only; the tested versions are pinned in constraints/dev.txt.
dev = [
    "pytest>=7.4",
    "pytest-xdist>=3.5",
    "coverage>=7.4",
    "ruff>=0.16.7",
    "mypy>=2.3",
    "build>=1.2",
    "setuptools>=77.0.3",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.setuptools]
# A meta-package: no import package and no module.
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
    "tests",
    "scripts",
    "packages/cubeproof/src",
    "packages/neighbourly/src",
    "packages/faces12-campaign/src",
    "tools/checks",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "C4", "PL", "RUF"]
ignore = [
    "E741",     # `l` is the standard name for the fourth element of a bracket
    "PLR0913",  # a frozen request object is not always clearer than five arguments
    "PLR0917",  # likewise for positional ones; the call sites are few and named
    "PLR2004",  # small integers in mathematics are values, not magic numbers
    "PLR0912",  # branch counts are kept down by review, not by a linter
    "PLR0915",
    "SIM108",   # an if/else is often clearer than a conditional expression
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLC0415", "B905"]
"packages/*/tests/*" = ["PLR2004", "PLC0415", "B905"]
# The independent reference of the formula was written from the article before the encoder was
# read and is kept as written, apart from formatting: its long messages and its local idioms
# are not rewritten to the house style, so that it stays a second hand.
"tests/reference/ref_*.py" = ["E501", "B023", "PLR0911", "PLW2901"]

[tool.ruff.lint.isort]
known-first-party = ["cubeproof", "neighbourly", "faces12_campaign"]

# `python3 -m mypy` checks the remaining scripts (scripts/build_paper.py); the packages, their
# tests and the check runners are checked with `mypy --strict` by `make lint`.
[tool.mypy]
python_version = "3.10"
files = ["scripts"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A hung test dumps its stack; the nested release-view test can take several minutes under load, so 1200 s is the bound.
faulthandler_timeout = 1200
# The three packages from source (no installation needed for the fast suites) and the shared
# check runners used by the architecture and release tests.
pythonpath = [
    "packages/cubeproof/src",
    "packages/neighbourly/src",
    "packages/faces12-campaign/src",
    "tools/checks",
]
addopts = "-ra --strict-markers"
# slow and image are opt-in (see conftest.py).
markers = [
    "slow: runs for more than about ten seconds",
    "image: needs the pinned Linux tools of the test image",
    "serial: timing-sensitive; never run in parallel workers (selected in conftest.py)",
    "release_view: re-runs the fast suites in the release view; make test-release-view",
]

[tool.coverage.run]
branch = true
source = ["cubeproof", "neighbourly", "faces12_campaign"]
concurrency = ["multiprocessing"]
parallel = true

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
