[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "neighbourly"
version = "1.0.0rc1"
description = "Neighbourly maps, exact geometry and their CNF encodings, with a generic CNF emission module"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrei Pirozhkov" }]
keywords = ["polyhedra", "neighbourly maps", "oriented matroids", "SAT", "CNF"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# Standard library only.
dependencies = []

[project.urls]
Homepage = "https://github.com/pirozhkov-andrei/polyhedraproof"
Source = "https://github.com/pirozhkov-andrei/polyhedraproof/tree/main/packages/neighbourly"
Issues = "https://github.com/pirozhkov-andrei/polyhedraproof/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The n = 12 corpus, the realized fixtures and their provenance (neighbourly.data).
neighbourly = [
    "py.typed",
    "data/provenance.json",
    "data/n12/*.json",
    "data/n12/matrices/*.txt",
    "data/n12/matrices/SHA256SUMS",
    "data/fixtures/*/*.txt",
    "data/fixtures/*/*.json",
]
