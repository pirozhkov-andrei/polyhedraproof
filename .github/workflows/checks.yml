name: checks
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    # Every event above. In the private development repository the jobs are skipped and use
    # no minutes. The actions are pinned by commit, like every other tool of the release.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv .venv
      - run: make install-dev PYTHON=.venv/bin/python
      - run: make lint PYTHON=.venv/bin/python
      - run: make test-architecture PYTHON=.venv/bin/python
      - run: make test-fast PYTHON=.venv/bin/python
  image:
    # The test image with the pinned CaDiCaL and cake_lpr: on a release tag or by hand.
    if: ${{ !github.event.repository.private && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: bash docker/test/run.sh build
      - run: bash docker/test/run.sh run
